<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadow</title>
    <style>
        p{
            color: azure;
            text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
        }
        div{
            width: 50px;
            height: 50px;
            
            box-shadow: 0 0 ;
        }

    </style>
</head>
<body>
    <h1>Border around text</h1>
</body>
</html>
